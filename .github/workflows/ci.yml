name: CI

# Non-host pipeline only. Host acceptance (dedicated `.zotero-chatgpt-dev/` Zotero profile, GUI, native
# annotations, upgrade/rollback) and `--live` model checks are intentionally NOT part of CI: they
# require a macOS GUI Zotero instance and, for `--live`, an authorized account. See
# docs/development.md. CI never publishes, never tags and never uploads a release asset.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  # Pure Node checks. No Zotero, no network beyond npm, no model requests.
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          # Pin the documented toolchain (.nvmrc 24.11.0, engines >=24 <25) instead of a moving major.
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:unit

  # Packaging must exercise the same commands docs/development.md promises. scripts/runtime-prepare.mjs
  # fetches the pinned, SHA-256-verified Codex 0.156.1 darwin/arm64 archive into the ignored
  # `.zotero-chatgpt-dev/runtime-cache/`; CI only packages and hashes it, it never executes it. The XPI name is
  # derived from packages/zotero/manifest.json, so a version bump cannot silently drift out of sync.
  package:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: node scripts/runtime-prepare.mjs
      - run: npm run package:dev
      # Re-run the suite AFTER packaging so the packaged-XPI checks actually execute. The two
      # `it.skipIf` cases in tests/build/install-lifecycle.test.ts are gated on `dist/` holding the
      # current manifest version's XPI, which is only true once `package:dev` has run; the `check`
      # job runs `test:unit` *before* packaging, so they silently skip there. Ordering matters: the
      # XPI bytes/SHA-256 check now runs here. The Apple codesign check additionally requires
      # `process.platform === 'darwin'` and therefore stays skipped on this linux runner (the
      # packaged XPI is a darwin/arm64 artifact built but never host-executed on linux).
      - run: npm run test:unit
      - run: npm run verify:artifacts
